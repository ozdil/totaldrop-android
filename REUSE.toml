# Copyright and license of the files that cannot carry them in a comment
# (images, JSON, translations, documents) or that are generated or copied.
# Source files carry their own SPDX lines; the REUSE tool checks both
# (`reuse lint`, in CI).
version = 1

# Everything not listed below: the Android module's license.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The TotalDrop Contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The protocol libraries and the translations that totaldrop-l10n compiles
# into itself.
[[annotations]]
path = [
  "crates/totaldrop-crypto/**",
  "crates/totaldrop-proto/**",
  "crates/totaldrop-core/**",
  "crates/totaldrop-l10n/**",
  "l10n/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 The TotalDrop Contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Generated: Flutter's localizations and the flutter_rust_bridge glue. They
# take the license of the app they are generated for.
[[annotations]]
path = [
  "ui-m3-expressive/lib/l10n/**",
  "ui-m3-expressive/lib/src/rust/**",
  "ui-m3-expressive/rust/src/frb_generated.rs",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 The TotalDrop Contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Cargokit, copied from flutter_rust_bridge's template (see its LICENSE).
[[annotations]]
path = "ui-m3-expressive/rust_builder/cargokit/**"
precedence = "override"
SPDX-FileCopyrightText = "2022 Matej Knopp"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The fonts, under their own license (their texts sit next to them).
[[annotations]]
path = [
  "ui-m3-expressive/assets/fonts/Atkinson*",
  "ui-m3-expressive/assets/fonts/OFL-AtkinsonHyperlegible.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2020 Braille Institute of America, Inc."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
  "ui-m3-expressive/assets/fonts/Bricolage*",
  "ui-m3-expressive/assets/fonts/OFL-BricolageGrotesque.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Bricolage Grotesque Project Authors"
SPDX-License-Identifier = "OFL-1.1"
